name: Android Build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub 的 ubuntu runner 已预装 Android SDK（/usr/local/lib/android/sdk）。
      # 不要用 android-actions/setup-android@v3：它会去安装早已下架的 legacy "tools" 包，
      # 在 sdkmanager 上直接报 "Failed to find package 'tools'" 并以 exit 1 中断。
      - name: 接受 SDK 许可并准备编译平台
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 尝试预装目标平台；若该包名在当前 sdkmanager 中不可用，AGP 会按其内置映射自动下载兜底
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" || true
          echo "已安装平台："
          ls "$SDK/platforms" || true
          echo "已安装 build-tools："
          ls "$SDK/build-tools" || true

      # 编译验证：Debug APK 能产出即说明整套 Kotlin/资源/NDK 依赖可用
      - name: 编译验证（assembleDebug）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: Yijing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
