name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 公开仓库免费即可运行的编译验证（不签名，仅确认代码能通过编译）
      - name: 编译验证（不签名）
        run: |
          xcodebuild -project Yijing.xcodeproj \
            -scheme Yijing \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ── 以下为可选：配置了签名 secrets 后，归档并上传 TestFlight ──
