name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      # 公开仓库免费即可运行的编译验证（不签名，仅确认代码能通过编译）
      - name: 编译验证（不签名）
        run: |
          xcodebuild -project Yijing.xcodeproj \
            -scheme Yijing \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ── 以下为可选：配置了签名 secrets 后，归档并导出未签名 IPA ──
      # 用于本机用 Sideloadly / AltStore 以自己的 Apple ID 自签安装（个人自用，无需 $99 账号）。
      # 原理：用 CODE_SIGNING_ALLOWED=NO 归档出 .xcarchive，
      #       再用手动签名方式导出为「未签名 IPA」，本机重签时即可用任意 Apple ID。

      - name: 归档（不签名）
        run: |
          xcodebuild -project Yijing.xcodeproj \
            -scheme Yijing \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Yijing.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: 导出 IPA 目录结构
        run: |
          mkdir -p build/ipa
          cp -R build/Yijing.xcarchive/Products/Applications/Yijing.app build/ipa/
          cd build/ipa
          mkdir -p Payload
          mv Yijing.app Payload/

      # ad-hoc 签名：把代码签名段（LC_CODE_SIGNATURE / _CodeSignature）补回二进制。
      # 原因：CODE_SIGNING_ALLOWED=NO 编出来的 Mach-O 完全没有签名段，
      #       Sideloadly / AltStore 重签时会直接报
      #       "Guru Meditation ... Invalid file"。这里先用本机自签（-）占住签名槽位，
      #       重签工具会把它整个替换成你 Apple ID 的签名。
      - name: Ad-hoc 签名（补齐代码签名段）
        run: |
          cd build/ipa
          codesign --force --sign - --timestamp=none --deep Payload/Yijing.app \
            || codesign --force --sign - --timestamp=none Payload/Yijing.app
          echo "── 签名段检查 ──"
          codesign -dvvv Payload/Yijing.app || true
          codesign --verify --verbose=2 Payload/Yijing.app || true

      - name: 打包 IPA
        run: |
          cd build/ipa
          zip -qry -X Yijing-adhoc.ipa Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: Yijing-adhoc-ipa
          path: ios/build/ipa/Yijing-adhoc.ipa
          retention-days: 14

      # ── 以下为可选：配置了签名 secrets 后，归档并上传 TestFlight ──
      # 需要仓库 Secrets：
      #   SIGNING_CERTIFICATE_BASE64      发行证书(.p12)的 base64
