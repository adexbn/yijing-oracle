name: Yijing
options:
  bundleIdPrefix: com.yijing
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

packages:
  llama.cpp:
    path: llama-ios
  LunarSwift:
    url: https://github.com/6tail/lunar-swift.git
    from: 1.0.0

targets:
  Yijing:
    type: application
    platform: iOS
    sources:
      - path: Yijing
    dependencies:
      - package: llama.cpp
        product: llama
      - package: LunarSwift
        product: LunarSwift
    info:
      path: Yijing/Info.plist
      properties:
        # 显式写入版本号，否则 XcodeGen 会用默认值 1.0 / 1 覆盖，
        # 导致日志里永远显示 build=1，无法判断手上装的是哪一版。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: 周易小卦
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于计算真太阳时（东经），以准确确定起卦时辰
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yijing.app
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # 之前这里是空字符串，等于告诉编译器「本 App 没有图标资源」，
        # 于是打包出来的 App 在桌面上就是系统默认的灰色占位图标。
        # 现已在 Yijing/Assets.xcassets 下新增 AppIcon 图标集，这里指回它。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO